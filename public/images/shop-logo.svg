<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="shopBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>

        <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e7ff"/>
        </linearGradient>

        <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>

        <filter id="shopShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Badge Background -->
    <rect width="48" height="48" rx="12" fill="url(#shopBgGrad)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Shopping Bag Vector with Modern Curves -->
    <g filter="url(#shopShadow)">
        <!-- Bag Handles -->
        <path d="M19 16 C19 12.5, 29 12.5, 29 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        
        <!-- Bag Body -->
        <path d="M14 17 L34 17 L31.8 35 C31.6 36.5, 30.5 37.5, 29 37.5 L19 37.5 C17.5 37.5, 16.4 36.5, 16.2 35 Z" fill="url(#bagGrad)"/>
        
        <!-- Isometric Inner Badge / Tag Accent -->
        <path d="M21 23 L27 23 C28.1 23, 29 23.9, 29 25 L29 29 C29 30.1, 28.1 31, 27 31 L21 31 C19.9 31, 19 30.1, 19 29 L19 25 C19 23.9, 19.9 23, 21 23 Z" fill="url(#pocketGrad)" opacity="0.9"/>
        
        <!-- Gift / Checkmark Ribbon inside tag -->
        <path d="M22 27 L23.5 28.5 L26 25.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Star / Sparkle Accent -->
    <circle cx="36" cy="13" r="2.2" fill="#38bdf8"/>
    <circle cx="36" cy="13" r="1.1" fill="#ffffff"/>
</svg>
