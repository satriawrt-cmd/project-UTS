<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="invBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <!-- Top Isometric Facet -->
        <linearGradient id="topFacetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#bae6fd"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>

        <!-- Left Isometric Facet -->
        <linearGradient id="leftFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#93c5fd"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>

        <!-- Right Isometric Facet -->
        <linearGradient id="rightFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <!-- Dynamic Arrow / Flow Gradient -->
        <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>

        <!-- Soft Shadow Filter -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Badge Container with Subtle Border -->
    <rect width="48" height="48" rx="12" fill="url(#invBgGrad)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- 3D Geometric Isometric Box Group -->
    <g filter="url(#softGlow)">
        <!-- Top Face -->
        <path d="M24 10.5 L36.5 17.5 L24 24.5 L11.5 17.5 Z" fill="url(#topFacetGrad)"/>
        
        <!-- Left Face -->
        <path d="M11.5 17.5 L24 24.5 L24 37 L11.5 30 Z" fill="url(#leftFacetGrad)"/>
        
        <!-- Right Face -->
        <path d="M24 24.5 L36.5 17.5 L36.5 30 L24 37 Z" fill="url(#rightFacetGrad)"/>

        <!-- Inbound/Outbound Dynamic Central Seam / Fold -->
        <path d="M24 24.5 L24 37" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4"/>
        <path d="M11.5 17.5 L24 24.5 L36.5 17.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6"/>

        <!-- Floating Stock-Flow Indicator (Upward Sales & Growth Arrow Accent) -->
        <path d="M24 13.5 L31 17.5 L28 17.5 L28 21.5 L20 21.5 L20 17.5 L17 17.5 Z" fill="#2563eb" fill-opacity="0.25"/>
    </g>

    <!-- Sparkle / Tech Node Accent -->
    <circle cx="36" cy="12" r="2.5" fill="#38bdf8"/>
    <circle cx="36" cy="12" r="1.2" fill="#ffffff"/>
</svg>
